name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize & Sync Capacitor Android
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          node scripts/ensure-google-services.js
          node scripts/ensure-keystore.js
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          node scripts/ensure-google-services.js
          node scripts/ensure-keystore.js
          npx cap sync android
          node scripts/patch-android-gradle.js
          npx cap sync android

      - name: Setup & Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
            echo "✅ Decoded custom keystore from ANDROID_KEYSTORE_BASE64 secret"
          else
            node scripts/ensure-keystore.js
            echo "✅ Ensured permanent fixed keystore from scripts/ensure-keystore.js"
          fi
          echo "======================================================="
          echo "🔑 BUILD APK SHA-1 FINGERPRINT FOR FIREBASE CONSOLE:"
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:" || true
          echo "======================================================="

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
