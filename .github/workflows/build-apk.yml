name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize & Sync Capacitor Android
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
            echo "✅ Restored google-services.json from secret"
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "✅ Copied google-services.json from root"
          else
            echo "⚠️ google-services.json not found in root; creating default configuration..."
            cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "540691753241",
    "project_id": "preroute-01",
    "storage_bucket": "preroute-01.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:540691753241:android:0c20089fdbc8bceda8bd88",
        "android_client_info": {
          "package_name": "com.PreRoute.app"
        }
      },
      "oauth_client": [
        {
          "client_id": "540691753241-hv25c44p2ulnvvcb3kpqt1p9k67eihv9.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.PreRoute.app",
            "certificate_hash": "fc0365cf5405d9c27a50b6ee2683b3ae218c716d"
          }
        },
        {
          "client_id": "540691753241-pcq4g6kdee8r4nmpb34d1bbq7ha0lg1r.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyDqhkwUsJ9zianGEosN1NW_w-gKveMa3Ik"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "540691753241-pcq4g6kdee8r4nmpb34d1bbq7ha0lg1r.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            echo "✅ Generated android/app/google-services.json"
          fi
          npx cap sync android
          node scripts/patch-android-gradle.js
          npx cap sync android

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
